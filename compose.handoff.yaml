name: hormuz-handoff
services:
  db:
    image: mobilitydb/mobilitydb:17-3.5-1.3
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT:-25433}:5432"
    volumes:
      - handoff-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  handoff-db:
