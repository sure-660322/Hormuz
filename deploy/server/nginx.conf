limit_req_zone $binary_remote_addr zone=agent:1m rate=6r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    auth_basic "Hormuz team";
    auth_basic_user_file /etc/nginx/htpasswd;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    location = /_container_health {
        auth_basic off;
        access_log off;
        return 204;
    }
    # Retired mutating endpoint is outside this read-only team deployment.
    location = /api/encounters/analyze { return 403; }
    location = /agent/analyze {
        limit_req zone=agent burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location ~ ^/(agent|api|cases|events|ships|simulation)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location ~ ^/(health|docs|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /tiles/ {
        alias /srv/tiles/;
        expires 7d;
        error_page 404 = /blank.png;
    }
    location = /blank.png { expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
}
