# 本地 OSM 瓦片服务配置（Windows Nginx）
# 用法见 deploy/tiles/start-tile-server.ps1
# 部署到服务器时：改 listen 端口和 alias 路径即可

worker_processes  1;

events {
    worker_connections  256;
}

http {
    include       D:/my_project/Hormuz/local-archive/nginx-1.30.5/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen 8080;

        location = /health {
            default_type text/plain;
            return 200 'tile server ok';
        }

        # 瓦片目录由 scripts/download_tiles.py 生成：tiles/{z}/{x}/{y}.png
        # z12 仅覆盖波斯湾核心区，范围外缺瓦时返回透明占位图而不是 404，
        # 前端不会出现裂图/错误提示
        error_page 404 = /blank.png;
        location = /blank.png {
            root D:/my_project/Hormuz/deploy/tiles;
        }

        location /tiles/ {
            alias D:/my_project/Hormuz/tiles/;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=2592000";
            expires 30d;
        }
    }
}
